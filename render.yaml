# Render Blueprint — provisions the LAPS web service + Postgres in one step.
# Deploy via the Render MCP, or in the Render dashboard: New → Blueprint → pick this repo.
databases:
  - name: laps-db
    databaseName: laps
    user: laps
    plan: free

services:
  - type: web
    name: laps
    runtime: node
    plan: free
    branch: claude/laps-sales-cycle-saas-2twnnv
    # build runs `prisma migrate deploy` (creates the schema) then `next build`
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /signin
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laps-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOW_DEV_LOGIN
        value: "true"
      # Public URL so Auth.js redirects to the deployed host (not localhost).
      # Update this if the service URL changes.
      - key: AUTH_URL
        value: https://laps-wxm8.onrender.com
      - key: NEXTAUTH_URL
        value: https://laps-wxm8.onrender.com
      # One-time gate for /api/admin/import (remove this + the route + data after loading).
      - key: IMPORT_SECRET
        value: f0a11b9b8791135cf219c90323935832
      - key: NODE_VERSION
        value: "22"
